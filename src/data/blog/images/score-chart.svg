<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-label="Baseline and Endline assessment scores by school">
<style>
  .bg       { fill: #f9fafb; }
  .title    { fill: #111827; font-family: system-ui, sans-serif; font-weight: 600; }
  .label    { fill: #6b7280; font-family: system-ui, sans-serif; }
  .value    { fill: #374151; font-family: system-ui, sans-serif; font-weight: 600; }
  .axis     { stroke: #d1d5db; }
  .grid     { stroke: #e5e7eb; }
  .bar-bl   { fill: #5B9BD5; }
  .bar-el   { fill: #6aab3f; }
